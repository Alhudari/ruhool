services:
  - type: web
    name: ruhool-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install && pnpm turbo build --filter=@ruhool/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RUHOOL_API_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
